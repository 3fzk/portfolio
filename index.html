<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Almas — Founder Luyn Network. Membangun infrastruktur game server sambil belajar RPL." />
    <title>Almas — Luyn Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="void">
    <canvas id="sky" aria-hidden="true"></canvas>

    <main class="page-shell">
      <section class="panel" aria-labelledby="name">

        <div class="status-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Online sekarang</span>
          <span class="clock" id="clock">--:--</span>
        </div>

        <div class="orbit">
          <span class="orbit-path" aria-hidden="true"></span>
          <span class="satellite" aria-hidden="true"></span>
          <div class="avatar">
            <img src="almas-profile.png" alt="Foto profil Almas" />
          </div>
        </div>

        <h1 id="name">Almas</h1>
        <p class="tagline">Membangun jaringan dari bumi<br /><b>sampai ke luar angkasa.</b></p>
        <p class="substatus">RPL 1, SMK Pasundan Majalaya</p>

        <nav class="links" aria-label="Tautan Almas">
          <a class="link" data-glow="violet" href="https://luynnetwork.app" target="_blank" rel="noreferrer">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">luynnetwork.app</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link" data-glow="teal" href="https://panel.luynnetwork.app" target="_blank" rel="noreferrer">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">Buka Almas Cloud</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link" data-glow="pink" href="https://instagram.com/alms.0x" target="_blank" rel="noreferrer">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">@alms.0x</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link" data-glow="gold" href="https://github.com/3fzk" target="_blank" rel="noreferrer">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">github.com/3fzk</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link" data-glow="blurple" href="https://discord.com/" target="_blank" rel="noreferrer">
            <span class="dot" aria-hidden="true"></span>
            <span class="label">discord / 3fzk</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <div class="panel-footer">
          <span>Terbuka untuk proyek baru</span>
          <span>42k kunjungan</span>
          <span>© <span id="year"></span></span>
        </div>

        <div class="theme-switcher" role="group" aria-label="Pilih mode langit">
          <button type="button" data-theme="void" class="active" aria-label="Mode Void">Void</button>
          <button type="button" data-theme="nebula" aria-label="Mode Nebula">Nebula</button>
          <button type="button" data-theme="solar" aria-label="Mode Solar">Solar</button>
        </div>
      </section>

      <p class="below-panel">Dirancang di bawah langit Majalaya, untuk Luyn Network.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
