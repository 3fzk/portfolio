    <script>
        // 1. Entry Overlay & Audio Playback Handler
        const overlay = document.getElementById('entry-overlay');
        const audio = document.getElementById('bg-music');
        const video = document.getElementById('bg-video');

        overlay.addEventListener('click', () => {
            // Unmute & Play Video if stuck
            if (video) {
                video.muted = false; // keep silent or allow video sound if video has track
                video.play().catch(() => {});
            }

            // Play Music
            if (audio) {
                audio.play().catch(err => {
                    console.log("Audio playback failed: ", err);
                });
            }

            // Fade out overlay
            overlay.classList.add('fade-out');
        });

        // 2. Discord Copy to Clipboard with Toast Notification
        function copyDiscord() {
            const discordUser = "alms0x";
            
            // Clipboard Fallback Strategy
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(discordUser);
            } else {
                const textarea = document.createElement("textarea");
                textarea.value = discordUser;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback copy failed', err);
                }
                document.body.removeChild(textarea);
            }

            showToast();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');

            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 2500);
        }

        // 3. Live Clock Widget
        function updateClock() {
            const clockEl = document.getElementById('live-clock');
            if (!clockEl) return;
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. Subtle Fake Views Incrementer (gun.lol aesthetic)
        let views = 1337;
        const viewsEl = document.getElementById('views-counter');
        
        // Random slight bump simulation
        setInterval(() => {
            if (Math.random() > 0.7) {
                views += 1;
                if (viewsEl) viewsEl.textContent = views.toLocaleString();
            }
        }, 4000);
    </script>
